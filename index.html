
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>x-center demo</title>
  <script src="x-center.js" defer></script>
</head>
<body>
  <x-center>
    <h1>Hello, custom element</h1>
    <p>This heading and paragraph are the innerHTML of the element,
       and they're centered by the styles the element applies to itself.</p>
  </x-center>

  <x-center>
    <img src="https://placehold.co/200x100" alt="placeholder">
    <p>Same element, different content.</p>
  </x-center>
</body>
</html>
